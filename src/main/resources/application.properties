quarkus.http.port=${PORT:8080}
# A random port for the tests, they find it out with @TestHTTPResource
quarkus.http.test-port=0

# --- Database ---
# In dev mode and tests, Quarkus Dev Services start PostgreSQL in a container,
# creates the tables and loads the demo data from import.sql.
# In production, configure the database, e.g. with environment variables
# QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME and QUARKUS_DATASOURCE_PASSWORD.
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
%prod.quarkus.hibernate-orm.schema-management.strategy=update

# --- Passkeys (WebAuthn) ---
quarkus.webauthn.relying-party.name=PathToPasskeys (Quarkus)
# Passkeys are bound to the domain. Without these, the domain and origin of the
# request are used, which is handy for development and tests on localhost.
%prod.quarkus.webauthn.relying-party.id=example.com
%prod.quarkus.webauthn.origins=https://example.com
# The built-in endpoints for login and registration (/q/webauthn/login and
# /q/webauthn/register), see PasskeyUserProvider and PasskeyRegistrationGuard
quarkus.webauthn.enable-login-endpoint=true
quarkus.webauthn.enable-registration-endpoint=true
# The login cookie is encrypted with this key. Without it, Quarkus generates a
# new key at each start, so everybody is logged out when the server restarts.
%prod.quarkus.http.auth.session.encryption-key=${SESSION_ENCRYPTION_KEY}
